# .github/workflows/pytest.yml
name: pytest

on:
  push:
    branches: [ main]
  pull_request:
    branches: [ next ]

jobs:
  architecture-check:
    name: Architecture Synchronization Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Run Architecture Sync Validation
      run: |
        python .agents/skills/architecture-sync/scripts/check_sync.py

  test:
    name: Test on Python ${{ matrix.python-version }}
    needs: architecture-check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.13', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          setup.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pytest>=7.0"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run pytest
      run: |
        # Add current directory to PYTHONPATH so 'app' can be imported
        export PYTHONPATH=$PYTHONPATH:.
        pytest tests/ -v --tb=short

    - name: Run pytest with coverage
      if: matrix.python-version == '3.12'
      run: |
        pip install pytest-cov
        export PYTHONPATH=$PYTHONPATH:.
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
