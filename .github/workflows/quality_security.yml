name: Code Quality & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'  # Wöchentlich montags für Security-Scans

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # Job 1: Ruff Linting & Formatting (schnell)
  ruff:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter
        run: ruff format --check --diff .

  # Job 2: Bandit Security Scan (parallel zu Ruff)
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]==1.8.0" bandit-sarif-formatter

      - name: Run Bandit
        run: |
          bandit -ll -r . -x ".venv,*/test/*,*/tests/*" -f sarif -o bandit-results.sarif || true
          bandit -ll -r . -x ".venv,*/test/*,*/tests/*" -f screen || true

      - name: Upload Bandit SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-results.sarif

      - name: Upload Bandit results artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-results
          path: bandit-results.sarif

  # Job 3: CodeQL Advanced Security (parallel, dauert länger)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality  # Erweiterte Security + Quality Queries

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  # Job 4: Dependency Security (parallel)
  dependencies:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scan dependencies with pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
          version: 2.7.3
          summary: true

  vulture:
    name: Vulture Dead Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Vulture
        run: |
          python -m pip install --upgrade pip
          pip install vulture==2.14

      - name: Run Vulture
        run: vulture . --exclude .venv,tests
