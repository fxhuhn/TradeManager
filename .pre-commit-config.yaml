# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        name: Ruff Linter
        args: [--fix]
      - id: ruff-format
        name: Ruff Formatter

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: [".", "--exclude", ".venv,tests"]
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-ll", "-x", "tests"]
        exclude: ^(tests/|\.venv/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        name: Mypy Strict Type Check
        args: [--strict, app]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-check
        name: Pytest Unit Test Suite
        entry: pytest tests/ -v --tb=short
        language: system
        pass_filenames: false
        always_run: true

      - id: architecture-sync-check
        name: Architecture Sync Check
        entry: python3 .agents/skills/architecture-sync/scripts/check_sync.py
        language: system
        pass_filenames: false
