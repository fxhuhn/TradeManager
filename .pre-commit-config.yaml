# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        name: Ruff Linter (Auto-Fix Imports)
        args: [--fix, --select=I,F401]
      - id: ruff-format
        name: Ruff Formatter

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: [".", "--exclude", ".venv,tests"]
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-x", "tests"]
        exclude: ^(tests/|\.venv/)

  - repo: https://github.com/pypa/pip-audit
    rev: v2.8.0
    hooks:
      - id: pip-audit
        args: ["-r", "requirements.txt"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        name: Mypy Strict Type Check
        args: [--strict, app]
        pass_filenames: false

  - repo: local
    hooks:
      - id: architecture-sync-check
        name: Architecture Sync Check
        entry: python3 .agents/skills/architecture-sync/scripts/check_sync.py
        language: system
        pass_filenames: false
